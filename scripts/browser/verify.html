<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FrameLens 验证页</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding-bottom: 68px;
        color: #172033;
        background: #f5f7fb;
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
      }
      header {
        padding: 22px;
        color: #172033;
        border-bottom: 1px solid #e2e6ef;
        background: #fff;
      }
      main {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 16px;
        padding: 22px;
      }
      article {
        min-height: 150px;
        padding: 18px;
        border: 1px solid #e2e6ef;
        border-radius: 14px;
        background: #fff;
      }
      nav {
        position: fixed;
        right: 0;
        bottom: 0;
        left: 0;
        z-index: 20;
        display: grid;
        height: 64px;
        grid-template-columns: repeat(4, 1fr);
        border-top: 1px solid #dde2eb;
        background: rgba(255, 255, 255, 0.98);
        box-shadow: 0 -8px 22px rgba(28, 38, 61, 0.08);
      }
      nav span {
        display: grid;
        color: #7b8495;
        font-size: 11px;
        place-items: center;
      }
      nav span:first-child {
        color: #5c5ede;
        font-weight: 700;
      }
      @media (max-width: 430px) {
        header { padding: 17px; }
        main { grid-template-columns: 1fr; padding: 14px; }
        article { min-height: 110px; }
      }
    </style>
  </head>
  <body>
    <header>
      <strong>FrameLens 响应式验证页</strong>
      <p>视口不超过 430px 时，卡片应从三列变为一列。</p>
      <p>外部数据：<b id="externalDataValue">数据版本 1</b></p>
    </header>
    <section id="closeFlow" hidden>
      <h1 id="routeTitle"></h1>
      <button id="testLoginBtn">登录验证账号</button>
      <input id="routeFocus" aria-label="页面内输入框" placeholder="点击这里后按 Esc" />
    </section>
    <main>
      <article>移动端卡片 01</article>
      <article>移动端卡片 02</article>
      <article>移动端卡片 03</article>
    </main>
    <nav id="testBottomBar" aria-label="底部标签栏">
      <span>首页</span>
      <span>事件</span>
      <span>消息</span>
      <span>我的</span>
    </nav>
    <script>
      if (location.pathname.startsWith("/close-flow/")) {
        document.querySelector("#closeFlow").hidden = false;
        const renderRoute = () => {
          document.querySelector("#routeTitle").textContent = location.pathname.endsWith("/login") ? "登录页" : "登录后的首页";
        };
        document.querySelector("#testLoginBtn").onclick = () => {
          sessionStorage.setItem("framelens-close-test-login", "yes");
          history.pushState({}, "", "/close-flow/home?from=login#feed");
          renderRoute();
        };
        renderRoute();
      }
      document.querySelector("#externalDataValue").textContent =
        localStorage.getItem("framelens-test-value") || "数据版本 1";
    </script>
  </body>
</html>
